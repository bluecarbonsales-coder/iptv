services:
  iptv-web:
    build: .
    image: iptv-web:1.0
    container_name: iptv-web
    restart: unless-stopped
    # Bound to loopback only: the host's openresty publishes it over TLS.
    ports:
      - "127.0.0.1:3920:3920"
    volumes:
      - iptv-data:/data
    environment:
      TZ: Asia/Tokyo
      REFRESH_HOURS: "${REFRESH_HOURS:-12}"
      # Required for POST /api/refresh coming from outside the host.
      REFRESH_TOKEN: "${REFRESH_TOKEN:-}"
      # Separate token for the persistent resource manager (falls back to REFRESH_TOKEN if unset).
      SOURCE_TOKEN: "${SOURCE_TOKEN:-}"
      # Agent endpoints remain disabled until a strong AGENT_API_TOKEN is set.
      AGENT_API_TOKEN: "${AGENT_API_TOKEN:-}"
      # Mail Workspace secrets: set these in the server .env, never in source control.
      EMAIL_WORKSPACE_PASSWORD: "${EMAIL_WORKSPACE_PASSWORD:-}"
      EMAIL_SESSION_SECRET: "${EMAIL_SESSION_SECRET:-}"
      EMAIL_CREDENTIALS_KEY: "${EMAIL_CREDENTIALS_KEY:-}"
      EMAIL_ALLOWED_MAIL_HOSTS: "${EMAIL_ALLOWED_MAIL_HOSTS:-mail.nafisainternational.com}"
      MAIL_COOKIE_SECURE: "${MAIL_COOKIE_SECURE:-1}"
      EMAIL_AGENT_SEND_MODE: "${EMAIL_AGENT_SEND_MODE:-approval}"
      # GitHub App/PAT with repository contents, pull-request, and Actions permissions for autonomous code changes.
      GITHUB_REPO_TOKEN: "${GITHUB_REPO_TOKEN:-}"
      GITHUB_REPOSITORY: "${GITHUB_REPOSITORY:-bluecarbonsales-coder/iptv}"
      GITHUB_DEFAULT_BRANCH: "${GITHUB_DEFAULT_BRANCH:-main}"
      # Agent writes remain enabled for authenticated project agents; this sets only scheduled import behavior.
      AGENT_AUTONOMY: "${AGENT_AUTONOMY:-full}"
      AGENT_AUTOMATION_ENABLED: "${AGENT_AUTOMATION_ENABLED:-1}"
      AUTO_SOURCE_SYNC_HOURS: "${AUTO_SOURCE_SYNC_HOURS:-12}"
      # Maintained TVboxorg registry is the default; set your own comma/newline-separated JSON registries to override.
      VOD_SOURCE_LIST_URLS: "${VOD_SOURCE_LIST_URLS:-https://raw.githubusercontent.com/TVboxorg/TVbox/main/dist/official.json}"
      MAX_VOD_SOURCES: "${MAX_VOD_SOURCES:-128}"
      MAX_SOURCES: "${MAX_SOURCES:-64}"
      # Inject metadata provider credentials via the host .env; never bake them into source.
      TMDB_API_KEY: "${TMDB_API_KEY:-}"
      OMDB_API_KEY: "${OMDB_API_KEY:-}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3920/healthz"]
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Full IPTV player (Live TV, EPG, Movies and Series). Kept on loopback;
  # publish it only through the private Cloudflare Tunnel hostname.
  nodecast-tv:
    image: ghcr.io/technomancer702/nodecast-tv:latest
    container_name: nodecast-tv
    restart: unless-stopped
    ports:
      - "127.0.0.1:3921:3000"
    volumes:
      - ./nodecast-data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Separate music service; only published on host loopback for Cloudflare Tunnel access.
  music-dl:
    image: guohuiyuan/go-music-dl:latest
    container_name: music-dl
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - music-data:/home/appuser/data
    environment:
      TZ: Asia/Tokyo
    command: ["./music-dl", "web", "--port", "8080", "--no-browser"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  iptv-data:
  music-data:
